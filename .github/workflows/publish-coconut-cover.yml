name: Publish approved Coconut cover
on:
  push:
    paths:
      - .github/workflows/publish-coconut-cover.yml
      - assets-source/coconut-mango-hero-20260909.jpg.b64
permissions:
  contents: write
concurrency:
  group: publish-coconut-cover
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Decode and verify exact approved JPEG
        run: |
          python3 - <<'PY'
          import base64, hashlib
          from pathlib import Path
          data=base64.b64decode(Path('assets-source/coconut-mango-hero-20260909.jpg.b64').read_text(),validate=True)
          assert hashlib.sha256(data).hexdigest()=='87a45515df49c877405067d1b6517ed525e8f2a75cdcb9e78890780c03432330'
          assert data[:3]==b'\xff\xd8\xff'
          target=Path('images/candle-coconut-mango/01-hero-tropical-20260909-v3.jpg')
          target.write_bytes(data)
          PY
      - name: Commit image only
        run: |
          git config user.name "Aromatopia automation"
          git config user.email "actions@users.noreply.github.com"
          git add images/candle-coconut-mango/01-hero-tropical-20260909-v3.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish verified Coconut tropical JPEG cover"
          git push origin HEAD:main
